name: argus
description: "Argus — Real-Time Human Presence Verification"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Camera pipeline
  camera: ^0.11.0
  permission_handler: ^11.3.1

  # Face detection (Android/iOS only)
  google_mlkit_face_detection: ^0.13.1

  # Backend API
  http: ^1.2.0

  # Design
  google_fonts: ^8.0.2

  # Local storage (onboarding flag, session history)
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # App icon generator
  flutter_launcher_icons: ^0.14.3

  # Native splash screen
  flutter_native_splash: ^2.4.0

# ─── App Icon Config ───
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0A0E17"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# ─── Splash Screen Config ───
flutter_native_splash:
  color: "#0A0E17"
  image: "assets/splash/splash_logo.png"
  android_12:
    color: "#0A0E17"
    image: "assets/splash/splash_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/
