spring:
  application:
    name: argus-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/argus}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

argus:
  jwt:
    # Base64-encoded 256-bit key for HMAC-SHA256 (default dev secret; override via env in prod)
    secret: ${ARGUS_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-validity-seconds: ${ARGUS_JWT_EXPIRY:3600}
    refresh-token-validity-seconds: ${ARGUS_JWT_REFRESH_EXPIRY:604800}

  rate-limiting:
    # TDD §5.4: 100 requests per minute per user/IP
    requests-per-minute: ${ARGUS_RATE_LIMIT:100}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

blockchain:
  # Old blockchain setting (kept for reference)
  enabled: false

gcp:
  ledger:
    enabled: ${GCP_LEDGER_ENABLED:false}
  kms:
    # Format: projects/[PROJECT_ID]/locations/[LOCATION]/keyRings/[RING]/cryptoKeys/[KEY]
    key-name: ${GCP_KMS_KEY_NAME:}
  firestore:
    project-id: ${GCP_PROJECT_ID:argus-gsc-26}
    database-id: ${GCP_FIRESTORE_DB:(default)}
