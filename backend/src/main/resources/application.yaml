server:
  port: 8090

spring:
  application:
    name: argus-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:argus;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
        format_sql: false
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    locations: classpath:db/migration


argus:
  jwt:
    # Base64-encoded 256-bit key for HMAC-SHA256 (default dev secret; override via env in prod)
    secret: ${ARGUS_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-validity-seconds: ${ARGUS_JWT_EXPIRY:3600}
    refresh-token-validity-seconds: ${ARGUS_JWT_REFRESH_EXPIRY:604800}

  rate-limiting:
    # TDD §5.4: 100 requests per minute per user/IP
    requests-per-minute: ${ARGUS_RATE_LIMIT:100}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

blockchain:
  # Old blockchain setting (kept for reference)
  enabled: false

gcp:
  ledger:
    enabled: ${GCP_LEDGER_ENABLED:false}
  kms:
    # Format: projects/[PROJECT_ID]/locations/[LOCATION]/keyRings/[RING]/cryptoKeys/[KEY]
    key-name: ${GCP_KMS_KEY_NAME:}
  firestore:
    project-id: ${GCP_PROJECT_ID:argus-gsc-26}
    database-id: ${GCP_FIRESTORE_DB:(default)}
